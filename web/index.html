<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>worklog · 工作记录</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<header class="bar">
  <div class="brand">worklog</div>
  <div class="projwrap">
    <select id="harnSel" class="projsel harnsel" aria-label="选择来源"></select>
    <select id="projSel" class="projsel" aria-label="选择项目"></select>
  </div>
  <div class="spacer"></div>
  <label class="theme-control"><span>配色</span>
    <select id="themeSel" aria-label="页面配色">
      <option value="midnight">午夜蓝</option>
      <option value="pine">墨松绿</option>
      <option value="plum">暮光梅</option>
    </select>
  </label>
  <div class="modes" id="modes" role="group" aria-label="条带颜色">
    <button data-mode="bars" aria-pressed="false">类型</button>
    <button data-mode="heat" aria-pressed="true" class="on">工作量</button>
  </div>
  <div class="ranges" id="ranges">
    <button data-days="7" class="on">近 7 天</button>
    <button data-days="14">近 14 天</button>
    <button data-days="28">近 28 天</button>
    <button data-days="0">全部</button>
  </div>
</header>

<section class="headline" id="headline">
  <div class="stats" id="stats"><div class="stat"><b>…</b><span>加载中</span></div></div>
  <div class="stamp" id="hlSub"></div>
</section>

<section class="legend" id="legend"></section>

<section class="ganttwrap" id="ganttwrap">
  <div class="modes grouping" id="grouping" role="group" aria-label="主题排序方式">
    <button data-order="project" aria-pressed="true" class="on">按项目</button>
    <button data-order="recent" aria-pressed="false">跨项目按更新</button>
  </div>
  <div class="gantt" id="taskRail"></div>
  <div class="timeline-scroll" id="timelineScroll" tabindex="0" role="region" aria-label="按天排列的任务时间轴">
    <div class="gantt" id="gantt"></div>
  </div>
</section>
<div class="tipbox" id="tipInner" hidden></div>

<section class="charts">
  <div class="panel">
    <h3>工作密度日历</h3>
    <div class="cap">近 12 周，格子越亮当天改动的文件越多</div>
    <div id="heatmap"></div>
  </div>
  <div class="panel">
    <h3>工作时段分布</h3>
    <div class="cap" id="hoursCap">当前跨度内，一天里几点在干活</div>
    <div id="hours"></div>
  </div>

  <div class="panel">
    <h3>每周产出结构</h3>
    <div class="cap">近 8 周，按产出类型分层，看重心迁移</div>
    <div id="weekly"></div>
  </div>
</section>

<section class="listwrap">
  <div class="listhead">工作单元卡片<span class="hint">点卡片展开详情；点甘特里的泳道会直接展开对应卡片</span></div>
  <div id="list" class="cards"></div>
</section>

<footer class="foot" id="foot"></footer>
<button class="backbtn" id="backToGantt" hidden><span class="ar">↑</span> 返回甘特图</button>
<script src="/app.js"></script>
</body>
</html>
